; Linux dedicated server. "Export as dedicated server" (dedicated_server=true)
; implies the dedicated_server feature tag + headless + stripped visuals.
;
; The GDExtension exporter already copies the matching library
; (libgdsqlite.linux.template_release.x86_64.so) next to the produced binary;
; the include_filter below only pins the *release* Linux library explicitly so
; it is never left behind, without shipping the debug library inside the PCK.
[preset.0]

name="Linux Server"
platform="Linux"
runnable=true
dedicated_server=true
advanced_options=false
custom_features=""
export_filter="all_resources"
include_filter="addons/godot-sqlite/bin/*.linux.template_release*"
exclude_filter=""
export_path="build/mmorpg_server.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
